version: 2
models:
  - name: stag_orders
    description: "Orders used for sales trend analysis."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stag_customers')
                field: customer_id

      - name: order_date
        data_tests:
          - not_null

  - name: stag_order_details
    description: "Order items used to calculate sales."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stag_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stag_products')
                field: product_id

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

  - name: stag_products
    description: "Products used for product and category performance analysis."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stag_categories')
                field: category_id

  - name: stag_categories
    description: "Categories used to compare product sales."
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: category_name
        data_tests:
          - not_null

  - name: stag_customers
    description: "Customers used for customer and country analysis."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique